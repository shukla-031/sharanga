<!DOCTYPE html>
<html lang="en" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏹 Sharanga - Login</title>
    <style>
        /* ============================================================
           CSS VARIABLES - THEME
           ============================================================ */
        :root {
            --bg-primary: #0a0e1a;
            --bg-card: rgba(17, 21, 46, 0.75);
            --bg-input: rgba(0, 0, 0, 0.35);
            --text-primary: #e0e0e0;
            --text-secondary: #8888bb;
            --text-muted: #444;
            --border-color: rgba(240, 192, 64, 0.12);
            --shadow-color: rgba(0, 0, 0, 0.6);
            --input-border: rgba(255, 255, 255, 0.04);
            --input-focus: rgba(240, 192, 64, 0.35);
            --error-bg: rgba(220, 53, 69, 0.1);
            --error-border: rgba(220, 53, 69, 0.15);
            --transition-speed: 0.6s;
            --glow-color: rgba(240, 192, 64, 0.08);
            --ring-color: rgba(240, 192, 64, 0.06);
            --ring-border: rgba(240, 192, 64, 0.06);
        }

        /* ============================================================
           LIGHT THEME
           ============================================================ */
        [data-theme="light"] {
            --bg-primary: #e8e0d8;
            --bg-card: rgba(255, 248, 240, 0.82);
            --bg-input: rgba(0, 0, 0, 0.04);
            --text-primary: #2a1f3d;
            --text-secondary: #6b5b7b;
            --text-muted: #b0a0b0;
            --border-color: rgba(100, 80, 120, 0.12);
            --shadow-color: rgba(60, 40, 80, 0.08);
            --input-border: rgba(0, 0, 0, 0.06);
            --input-focus: rgba(240, 192, 64, 0.35);
            --error-bg: rgba(220, 53, 69, 0.06);
            --error-border: rgba(220, 53, 69, 0.1);
            --glow-color: rgba(240, 192, 64, 0.05);
            --ring-color: rgba(240, 192, 64, 0.04);
            --ring-border: rgba(240, 192, 64, 0.06);
        }

        /* ============================================================
           BASE
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            transition: background var(--transition-speed) ease;
        }

        /* ============================================================
           BACKGROUND EFFECTS
           ============================================================ */
        .bg-orbs {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.15;
            z-index: 0;
            animation: float 25s infinite ease-in-out;
            pointer-events: none;
            transition: all var(--transition-speed) ease;
        }
        .bg-orbs:nth-child(1) {
            width: 600px;
            height: 600px;
            background: #f0c040;
            top: -15%;
            left: -10%;
            animation-delay: 0s;
        }
        .bg-orbs:nth-child(2) {
            width: 450px;
            height: 450px;
            background: #4a9eff;
            bottom: -15%;
            right: -10%;
            animation-delay: -8s;
        }
        .bg-orbs:nth-child(3) {
            width: 350px;
            height: 350px;
            background: #7c3aed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: -16s;
        }

        [data-theme="light"] .bg-orbs {
            opacity: 0.08;
        }
        [data-theme="light"] .bg-orbs:nth-child(1) {
            background: radial-gradient(circle, #4a9eff 0%, #2d7dd2 40%, #1a5a9e 100%);
        }
        [data-theme="light"] .bg-orbs:nth-child(2) {
            background: radial-gradient(circle, #f0c040 0%, #e6a800 40%, #cc8800 100%);
        }
        [data-theme="light"] .bg-orbs:nth-child(3) {
            background: radial-gradient(circle, #28a745 0%, #1a8a3a 40%, #0d6b2a 100%);
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(60px, -40px) scale(1.1); }
            50% { transform: translate(-30px, 50px) scale(0.9); }
            75% { transform: translate(40px, -30px) scale(1.05); }
        }

        /* ============================================================
           MAIN CONTAINER - LEFT/RIGHT LAYOUT
           ============================================================ */
        .login-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 1200px;
            padding: 20px;
            gap: 40px;
            z-index: 1;
            position: relative;
        }

        /* ============================================================
           LEFT SIDE - LOGIN FORM
           ============================================================ */
        .login-left {
            flex: 1;
            max-width: 460px;
            position: relative;
            z-index: 2;
            animation: slideInLeft 0.9s ease-out;
        }

        @keyframes slideInLeft {
            0% { opacity: 0; transform: translateX(-60px) scale(0.96); }
            100% { opacity: 1; transform: translateX(0) scale(1); }
        }

        .login-container {
            background: var(--bg-card);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-radius: 28px;
            padding: 45px 40px 35px;
            border: 1px solid var(--border-color);
            box-shadow: 0 25px 80px var(--shadow-color), inset 0 1px 0 rgba(255, 255, 255, 0.03);
            transition: all var(--transition-speed) ease;
            position: relative;
            overflow: hidden;
        }

        .login-container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at 30% 20%, rgba(240, 192, 64, 0.03), transparent 60%),
                        radial-gradient(ellipse at 70% 80%, rgba(74, 158, 255, 0.02), transparent 60%);
            pointer-events: none;
            z-index: 0;
        }

        /* ============================================================
           THEME TOGGLE - RIGHT SIDE UPPER CORNER
           ============================================================ */
        .theme-toggle-wrapper {
            position: fixed;
            top: 25px;
            right: 30px;
            z-index: 1000;
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 30px;
            padding: 5px;
            display: flex;
            align-items: center;
            gap: 4px;
            box-shadow: 0 4px 25px var(--shadow-color);
            transition: all var(--transition-speed) ease;
        }

        .theme-toggle-wrapper:hover {
            border-color: rgba(240, 192, 64, 0.3);
        }

        .theme-toggle-wrapper .toggle-btn {
            padding: 6px 14px;
            border-radius: 25px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-size: 0.8em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .theme-toggle-wrapper .toggle-btn.active {
            background: #f0c040;
            color: #0a0e1a;
            box-shadow: 0 2px 20px rgba(240, 192, 64, 0.25);
        }

        .theme-toggle-wrapper .toggle-btn:hover {
            color: var(--text-primary);
        }

        .theme-toggle-wrapper .toggle-btn.active:hover {
            color: #0a0e1a;
        }

        /* ============================================================
           LOGO INSIDE FORM
           ============================================================ */
        .logo-wrapper {
            text-align: center;
            margin-bottom: 5px;
            position: relative;
            z-index: 1;
        }

        .logo-wrapper .logo-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 80px;
            height: 80px;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            border: 2px solid var(--ring-border);
            animation: spin-ring 12s linear infinite;
        }
        .logo-wrapper .logo-ring::before {
            content: '';
            position: absolute;
            top: -3px;
            left: 50%;
            transform: translateX(-50%);
            width: 8px;
            height: 8px;
            background: #f0c040;
            border-radius: 50%;
            box-shadow: 0 0 30px #f0c040, 0 0 60px rgba(240, 192, 64, 0.1);
        }
        @keyframes spin-ring {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }

        .logo-wrapper .logo-text {
            font-size: 3.5em;
            display: inline-block;
            animation: pulse-logo 4s ease-in-out infinite;
            position: relative;
            z-index: 1;
            filter: drop-shadow(0 0 25px rgba(240, 192, 64, 0.15));
        }
        @keyframes pulse-logo {
            0%, 100% { transform: scale(1) rotate(0deg); filter: drop-shadow(0 0 25px rgba(240, 192, 64, 0.15)); }
            50% { transform: scale(1.06) rotate(-2deg); filter: drop-shadow(0 0 50px rgba(240, 192, 64, 0.3)); }
        }

        .login-container h1 {
            text-align: center;
            background: linear-gradient(135deg, #f0c040, #ffd700, #f0c040);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 2.2em;
            font-weight: 800;
            letter-spacing: 2px;
            animation: shimmer 5s ease-in-out infinite;
            margin-top: -8px;
            position: relative;
            z-index: 1;
        }
        @keyframes shimmer {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .login-container .sub {
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.65em;
            margin-top: -2px;
            margin-bottom: 28px;
            letter-spacing: 4px;
            text-transform: uppercase;
            font-weight: 300;
            transition: color var(--transition-speed) ease;
            position: relative;
            z-index: 1;
        }

        /* ============================================================
           DIVIDER
           ============================================================ */
        .divider {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.65em;
            margin: 18px 0 22px;
            position: relative;
            letter-spacing: 2px;
            opacity: 0.3;
            transition: color var(--transition-speed) ease;
            z-index: 1;
        }
        .divider::before,
        .divider::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 28%;
            height: 1px;
            background: var(--input-border);
        }
        .divider::before { left: 0; }
        .divider::after { right: 0; }

        /* ============================================================
           FORM
           ============================================================ */
        .login-container label {
            color: var(--text-secondary);
            font-size: 0.8em;
            display: block;
            margin-bottom: 4px;
            font-weight: 500;
            letter-spacing: 0.5px;
            transition: color var(--transition-speed) ease;
            position: relative;
            z-index: 1;
        }

        .login-container .input-group {
            position: relative;
            margin-bottom: 18px;
            z-index: 1;
        }
        .login-container .input-group .icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 1.1em;
            transition: color 0.3s;
            z-index: 2;
        }
        .login-container .input-group:focus-within .icon {
            color: #f0c040;
        }

        .login-container .input-group input {
            width: 100%;
            padding: 14px 16px 14px 48px;
            background: var(--bg-input);
            border: 1px solid var(--input-border);
            border-radius: 14px;
            color: var(--text-primary);
            font-size: 0.95em;
            outline: none;
            transition: all 0.4s ease;
            font-family: inherit;
        }
        .login-container .input-group input::placeholder {
            color: var(--text-muted);
            font-weight: 300;
            opacity: 0.35;
        }
        .login-container .input-group input:focus {
            border-color: var(--input-focus);
            background: var(--bg-input);
            box-shadow: 0 0 40px rgba(240, 192, 64, 0.03), inset 0 0 40px rgba(240, 192, 64, 0.01);
        }

        /* ============================================================
           BUTTON
           ============================================================ */
        .login-container button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #f0c040, #d4a800);
            border: none;
            border-radius: 14px;
            color: #0a0e1a;
            font-size: 1.05em;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.4s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 6px;
            position: relative;
            overflow: hidden;
            letter-spacing: 0.5px;
            z-index: 1;
        }
        .login-container button::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.15) 0%, transparent 60%);
            opacity: 0;
            transition: opacity 0.6s;
            transform: scale(0.5);
        }
        .login-container button:hover::before {
            opacity: 1;
            transform: scale(1);
        }
        .login-container button:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 50px rgba(240, 192, 64, 0.3);
        }
        .login-container button:active {
            transform: scale(0.97);
        }

        /* ============================================================
           ERROR
           ============================================================ */
        .login-container .error {
            color: #ff6b6b;
            text-align: center;
            margin-bottom: 14px;
            font-size: 0.85em;
            background: var(--error-bg);
            padding: 10px 16px;
            border-radius: 12px;
            border: 1px solid var(--error-border);
            backdrop-filter: blur(10px);
            transition: all var(--transition-speed) ease;
            z-index: 1;
            position: relative;
        }

        /* ============================================================
           FOOTER
           ============================================================ */
        .footer-text {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.65em;
            margin-top: 24px;
            padding-top: 18px;
            border-top: 1px solid var(--input-border);
            letter-spacing: 1px;
            opacity: 0.4;
            transition: color var(--transition-speed) ease, border var(--transition-speed) ease;
            position: relative;
            z-index: 1;
        }
        .footer-text span {
            color: #f0c040;
            font-weight: 500;
        }
        .footer-text .version {
            display: block;
            margin-top: 4px;
            color: var(--text-muted);
            font-size: 0.75em;
            letter-spacing: 2px;
            opacity: 0.5;
        }

        /* ============================================================
           RIGHT SIDE - DYNAMIC LOGO WITH HACK PROTECTION
           ============================================================ */
        .login-right {
            flex: 1;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 2;
            animation: slideInRight 0.9s ease-out;
        }

        @keyframes slideInRight {
            0% { opacity: 0; transform: translateX(60px) scale(0.96); }
            100% { opacity: 1; transform: translateX(0) scale(1); }
        }

        .logo-display {
            position: relative;
            width: 100%;
            max-width: 450px;
            aspect-ratio: 1/0.9;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Large Logo */
        .logo-display .main-logo {
            font-size: 12em;
            position: relative;
            z-index: 2;
            animation: logo-float 6s ease-in-out infinite;
            filter: drop-shadow(0 0 40px rgba(240, 192, 64, 0.15));
        }

        @keyframes logo-float {
            0%, 100% { transform: translateY(0) scale(1) rotate(0deg); }
            25% { transform: translateY(-10px) scale(1.02) rotate(-2deg); }
            75% { transform: translateY(10px) scale(0.98) rotate(2deg); }
        }

        /* ============================================================
           RINGS - DARKER VERSION
           ============================================================ */
        .logo-display .glow-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 85%;
            height: 85%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            border: 2px solid rgba(240, 192, 64, 0.08);
            animation: spin-ring 15s linear infinite;
            z-index: 1;
        }
        .logo-display .glow-ring::before {
            content: '';
            position: absolute;
            top: -3px;
            left: 50%;
            transform: translateX(-50%);
            width: 8px;
            height: 8px;
            background: rgba(240, 192, 64, 0.4);
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(240, 192, 64, 0.1);
        }

        /* Outer Dark Ring */
        .logo-display .outer-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 105%;
            height: 105%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            border: 1px solid rgba(240, 192, 64, 0.04);
            animation: spin-ring 20s linear infinite reverse;
            z-index: 0;
        }
        .logo-display .outer-ring::before {
            content: '';
            position: absolute;
            bottom: -3px;
            left: 50%;
            transform: translateX(-50%);
            width: 6px;
            height: 6px;
            background: rgba(240, 192, 64, 0.2);
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(240, 192, 64, 0.05);
        }

        /* Extra Dark Ring */
        .logo-display .dark-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 95%;
            height: 95%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            border: 1px solid rgba(240, 192, 64, 0.03);
            animation: spin-ring 18s linear infinite;
            z-index: 0;
        }
        .logo-display .dark-ring::after {
            content: '';
            position: absolute;
            top: -2px;
            right: 30%;
            width: 4px;
            height: 4px;
            background: rgba(240, 192, 64, 0.15);
            border-radius: 50%;
        }

        /* ============================================================
           HACK PROTECTION EFFECT - GLITCH/MATRIX
           ============================================================ */
        .hack-protection {
            margin-top: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(0, 0, 0, 0.3);
            padding: 12px 24px;
            border-radius: 50px;
            border: 1px solid rgba(40, 167, 69, 0.2);
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }

        .hack-protection .shield {
            font-size: 1.4em;
            animation: shield-pulse 2s ease-in-out infinite;
        }

        @keyframes shield-pulse {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.15); opacity: 1; }
        }

        .hack-protection .text {
            color: #28a745;
            font-size: 0.85em;
            font-weight: 600;
            letter-spacing: 1px;
            font-family: 'Courier New', monospace;
            position: relative;
        }

        .hack-protection .text::before {
            content: '🔒 UNBREAKABLE PROTECTION';
            position: absolute;
            top: 0;
            left: 0;
            color: rgba(40, 167, 69, 0.2);
            animation: glitch-text 3s infinite;
            opacity: 0.6;
            pointer-events: none;
        }

        @keyframes glitch-text {
            0%, 100% { transform: translate(0, 0); opacity: 0; }
            2% { transform: translate(-3px, 2px); opacity: 0.8; }
            4% { transform: translate(3px, -2px); opacity: 0.6; }
            6% { transform: translate(-2px, 1px); opacity: 0; }
            90% { opacity: 0; }
            92% { transform: translate(2px, -1px); opacity: 0.5; }
            94% { transform: translate(-2px, 1px); opacity: 0.3; }
            96% { transform: translate(1px, -2px); opacity: 0; }
        }

        .hack-protection .matrix-lines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events: none;
            opacity: 0.05;
        }

        .hack-protection .matrix-lines span {
            display: inline-block;
            color: #28a745;
            font-size: 0.6em;
            font-family: 'Courier New', monospace;
            animation: matrix-fall 4s linear infinite;
            position: absolute;
            opacity: 0;
        }

        .hack-protection .matrix-lines span:nth-child(1) { left: 10%; animation-delay: 0s; }
        .hack-protection .matrix-lines span:nth-child(2) { left: 30%; animation-delay: 1.2s; }
        .hack-protection .matrix-lines span:nth-child(3) { left: 50%; animation-delay: 2.5s; }
        .hack-protection .matrix-lines span:nth-child(4) { left: 70%; animation-delay: 0.8s; }
        .hack-protection .matrix-lines span:nth-child(5) { left: 90%; animation-delay: 1.8s; }

        @keyframes matrix-fall {
            0% { transform: translateY(-100%); opacity: 0; }
            10% { opacity: 0.5; }
            80% { opacity: 0.5; }
            100% { transform: translateY(1000%); opacity: 0; }
        }

        .hack-protection .status-dots {
            display: flex;
            gap: 4px;
        }
        .hack-protection .status-dots span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #28a745;
            animation: dot-flash 1.5s ease-in-out infinite;
        }
        .hack-protection .status-dots span:nth-child(2) { animation-delay: 0.3s; }
        .hack-protection .status-dots span:nth-child(3) { animation-delay: 0.6s; }

        @keyframes dot-flash {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        .hack-protection::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(40, 167, 69, 0.05), transparent);
            animation: scan-line 3s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes scan-line {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 992px) {
            .login-wrapper {
                flex-direction: column;
                gap: 30px;
                padding: 40px 20px;
            }
            .login-left {
                max-width: 100%;
                width: 100%;
            }
            .login-right {
                max-width: 100%;
                width: 100%;
            }
            .logo-display .main-logo {
                font-size: 8em;
            }
            .login-container {
                padding: 35px 30px 30px;
            }
            .theme-toggle-wrapper {
                top: 15px;
                right: 15px;
                padding: 4px;
            }
            .theme-toggle-wrapper .toggle-btn {
                font-size: 0.7em;
                padding: 4px 10px;
            }
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 25px 20px 22px;
            }
            .login-container h1 {
                font-size: 1.6em;
            }
            .logo-wrapper .logo-text {
                font-size: 2.8em;
            }
            .logo-wrapper .logo-ring {
                width: 65px;
                height: 65px;
            }
            .login-container .input-group input {
                padding: 11px 12px 11px 38px;
                font-size: 0.85em;
            }
            .theme-toggle-wrapper {
                top: 10px;
                right: 10px;
                padding: 3px;
            }
            .theme-toggle-wrapper .toggle-btn {
                font-size: 0.6em;
                padding: 3px 8px;
            }
            .logo-display .main-logo {
                font-size: 5em;
            }
            .hack-protection {
                padding: 10px 16px;
                flex-wrap: wrap;
                justify-content: center;
            }
            .hack-protection .text {
                font-size: 0.7em;
            }
            .logo-display .glow-ring {
                width: 90%;
                height: 90%;
            }
            .logo-display .outer-ring {
                width: 100%;
                height: 100%;
            }
            .logo-display .dark-ring {
                width: 95%;
                height: 95%;
            }
        }
    </style>
</head>
<body>

    <!-- ============================================================
         BACKGROUND ORBS
         ============================================================ -->
    <div class="bg-orbs"></div>
    <div class="bg-orbs"></div>
    <div class="bg-orbs"></div>

    <!-- ============================================================
         THEME TOGGLE - RIGHT SIDE UPPER CORNER
         ============================================================ -->
    <div class="theme-toggle-wrapper" id="themeToggle">
        <button class="toggle-btn active" data-theme="dark" onclick="setTheme('dark')">🌙 Dark</button>
        <button class="toggle-btn" data-theme="light" onclick="setTheme('light')">☀️ Light</button>
    </div>

    <!-- ============================================================
         MAIN WRAPPER - LEFT/RIGHT LAYOUT
         ============================================================ -->
    <div class="login-wrapper">

        <!-- ============================================================
           LEFT SIDE - LOGIN FORM
           ============================================================ -->
        <div class="login-left">
            <div class="login-container">

                <!-- Logo -->
                <div class="logo-wrapper">
                    <div class="logo-ring"></div>
                    <span class="logo-text">🏹</span>
                </div>

                <h1>Sharanga</h1>
                <div class="sub">⚔️ The Divine Bow of Cyber Defense</div>

                <!-- Error -->
                {% if error %}
                <div class="error">{{ error }}</div>
                {% endif %}

                <!-- Form -->
                <form method="POST">
                    <div class="input-group">
                        <span class="icon">👤</span>
                        <input type="text" name="username" placeholder="Enter username" required autofocus>
                    </div>

                    <div class="input-group">
                        <span class="icon">🔒</span>
                        <input type="password" name="password" placeholder="Enter password" required>
                    </div>

                    <button type="submit">🔓 Login</button>
                </form>

                <div class="divider">Secure Access</div>

                <div class="footer-text">
                    🏹 <span>Sharanga</span> v2.0
                    <span class="version">🔐 Endpoint Security &amp; Asset Management</span>
                </div>
            </div>
        </div>

        <!-- ============================================================
           RIGHT SIDE - DYNAMIC LOGO WITH HACK PROTECTION
           ============================================================ -->
        <div class="login-right">
            <div class="logo-display">
                <!-- Dark Ring -->
                <div class="dark-ring"></div>
                <!-- Outer Ring -->
                <div class="outer-ring"></div>
                <!-- Glow Ring -->
                <div class="glow-ring"></div>
                <!-- Main Logo -->
                <div class="main-logo">🏹</div>
            </div>

            <!-- Hack Protection Badge -->
            <div class="hack-protection">
                <div class="matrix-lines">
                    <span>01 10 11 00</span>
                    <span>10 01 00 11</span>
                    <span>11 00 10 01</span>
                    <span>00 11 01 10</span>
                    <span>01 10 00 11</span>
                </div>
                <span class="shield">🛡️</span>
                <span class="text">🔒 UNBREAKABLE PROTECTION</span>
                <div class="status-dots">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>
        </div>

    </div>

    <!-- ============================================================
         THEME TOGGLE SCRIPT
         ============================================================ -->
    <script>
        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('sharanga-theme', theme);

            document.querySelectorAll('.theme-toggle-wrapper .toggle-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.dataset.theme === theme) {
                    btn.classList.add('active');
                }
            });
        }

        (function loadTheme() {
            const saved = localStorage.getItem('sharanga-theme');
            if (saved) {
                setTheme(saved);
            } else {
                setTheme('dark');
            }
        })();
    </script>

</body>
</html>
